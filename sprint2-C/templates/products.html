{% extends "base.html" %}
{% block content %}
<h2 class="productos-title">Productos</h2>
<form method="post" class="card productos-form">
  {% for categoria, lista in por_categoria.items() %}
    {% set cat_class = categoria.lower() %}
    <h3 class="categoria-title {{ cat_class }}">{{ categoria }}</h3>
    <div class="productos-grid">
      {% for p in lista %}
        <div class="producto-card {{ cat_class }}">
          <div class="producto-header">
            <strong class="producto-nombre">{{ p.nombre }}</strong>
            <span class="producto-precio">{{ p.precio|ars }}</span>
          </div>
          <div class="producto-desc">{{ p.descripcion }}</div>
          <div class="producto-cantidad">
            <label for="prod_{{ p.id }}">Cantidad:</label>
            <button type="button" onclick="cambiarCantidad('{{ p.id }}', -1)" class="btn-menos">−</button>
            <input type="number" min="0" name="prod_{{ p.id }}" id="prod_{{ p.id }}" value="{{ cart.get(p.id, 0) }}">
            <button type="button" onclick="cambiarCantidad('{{ p.id }}', 1)" class="btn-mas">+</button>
          </div>
        </div>
      {% endfor %}
    </div>
  {% endfor %}
  <div class="actions productos-actions">
    <button type="submit" name="accion" value="agregar" class="btn-principal">Agregar</button>
    <button type="submit" name="accion" value="actualizar" class="btn-principal">Actualizar carrito</button>
    <a class="btn btn-secundario" href="{{ url_for('ver_carrito') }}">Ver carrito</a>
  </div>
</form>
<script>
function cambiarCantidad(id, delta) {
  var input = document.getElementById('prod_' + id);
  var val = parseInt(input.value) || 0;
  val += delta;
  if (val < 0) val = 0;
  input.value = val;
}
</script>
<style>
/* Quitar flechas de los inputs number en Chrome, Safari, Edge, Opera */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
  -webkit-appearance: none;
  margin: 0;
}
/* Quitar flechas en Firefox */
input[type=number] {
  -moz-appearance: textfield;
}
</style>
{% endblock %}
