
{% extends "base.html" %}
{% block content %}
<h2>Combos y Promociones</h2>
<form method="post" action="{{ url_for('agregar_actualizar_combos') }}" class="card">
  <div class="combos-grid">
    {% for c in combos %}
      <div class="card-item">
        <strong>{{ c.nombre }}</strong><br>
        <small>{{ c.descripcion }}</small><br>
        <span>Precio: {{ c.precio|ars }}</span><br>
        <label>Cantidad:
          <input type="number" min="0" name="combo_{{ c.id }}" value="{{ cart.get(c.id|string, 0) }}">
        </label>
      </div>
    {% endfor %}
  </div>
  <div class="actions">
    <button type="submit">Agregar carrito</button>
    <button type="button">Actualizar carrito</button>
    <a class="btn" href="{{ url_for('ver_carrito') }}">Ver carrito</a>
    <a class="btn" href="{{ url_for('listar_productos') }}">Ver productos</a>
  </div>
</form>
{% endblock %}
