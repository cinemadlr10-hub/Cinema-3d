<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio - Cine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial, sans-serif; background:#0b1020; color:#e5e7eb; margin:0; min-height:100vh; display:grid; place-items:center}
    .card{width:min(720px,92vw); background:#111827; border:1px solid #1f2937; border-radius:14px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.45)}
    h1{margin:0 0 8px}
    p{margin:6px 0 14px}
    .ok{color:#22c55e}
    .no{color:#f87171}
    a{display:inline-block; margin-right:12px; padding:10px 14px; border-radius:10px; text-decoration:none; background:#0b1222; border:1px solid #1f2937; color:#e5e7eb}
    a:hover{box-shadow:0 0 0 3px rgba(51,65,85,.25)}
  </style>
</head>
<body>
  <div class="card">
    <h1>Inicio Cine</h1>
    <p>Base de datos: <strong class="{{ 'ok' if db_ok else 'no' }}">{{ 'OK' if db_ok else 'NO CREADA' }}</strong></p>
    <p>
      <a href="/registro">Registro</a>
      <a href="/pago">Pago</a>
      <a href="/transacciones">Transacciones</a> <!-- 👈 nuevo botón -->
    </p>
  </div>
</body>
</html>
