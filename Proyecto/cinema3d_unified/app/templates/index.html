<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla de Inicio - Sucursales</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #232946 0%, #1a1a2e 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', 'Montserrat', Arial, sans-serif;
            position: relative;
            overflow: hidden;
            color: #eaeaea;
        }
        /* Efecto de partículas sutil */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
    .center-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #232946;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(44,62,80,0.23);
            padding: 2.8rem 3.5rem 2.5rem 3.5rem;
            min-width: 370px;
            max-width: 95vw;
            animation: fadeIn 1.1s cubic-bezier(.4,0,.2,1);
            color: #eaeaea;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-cine {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .logo-cine svg {
            width: 60px;
            height: 60px;
            margin-right: 0.5rem;
        }
        h1 {
            margin-top: 0;
            font-size: 2.8rem;
            color: #eaeaea;
            text-shadow: 2px 2px 8px #23294644;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            font-family: 'Montserrat', 'Poppins', Arial, sans-serif;
        }
        h2 {
            font-size: 1.3rem;
            color: #b8c1ec;
            margin-bottom: 1.2rem;
            font-weight: 600;
            text-align: center;
            font-family: 'Poppins', 'Montserrat', Arial, sans-serif;
        }
        form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.7rem;
        }
        select {
            font-size: 1.13rem;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            border: 1.5px solid #393e6e;
            background: #1a1a2e;
            color: #eaeaea;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', Arial, sans-serif;
            box-shadow: 0 2px 8px #23294633;
        }
        select:focus {
            border: 1.5px solid #b8c1ec;
            outline: none;
            box-shadow: 0 0 0 2px #b8c1ec44;
        }
        button {
            font-size: 1.13rem;
            padding: 0.6rem 1.7rem;
            border-radius: 10px;
            background: linear-gradient(90deg, #3a86ff 60%, #5e60ce 100%);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 12px #23294633;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        button:hover {
            background: linear-gradient(90deg, #232946 60%, #3a86ff 100%);
            transform: translateY(-2px) scale(1.06);
            box-shadow: 0 4px 18px #23294655;
        }
        #msg {
            color: #d32f2f;
            margin-top: 0.5rem;
            text-align: center;
        }
        .selected-branch {
            margin-top: 1.5rem;
            font-size: 1.18rem;
            color: #b8c1ec;
            text-align: center;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        .clear-btn {
            background: #393e6e;
            color: #eaeaea;
            border: 1px solid #b8c1ec;
            margin-top: 0.7rem;
            font-weight: 700;
            transition: background 0.2s, color 0.2s, border 0.2s;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .clear-btn:hover {
            background: #d32f2f;
            color: #fff;
            border: 1px solid #d32f2f;
        }
    </style>
</head>
<body>
  <div style="text-align:right;margin:10px;"><a href="/registro" class="btn-register">Registrarse</a></div>
            <canvas class="particles"></canvas>
                <div class="center-container">
                    <div class="card">
                        <div class="logo-cine">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <ellipse cx="32" cy="32" rx="30" ry="18" fill="#3a86ff" fill-opacity="0.13"/>
                                <rect x="14" y="18" width="36" height="28" rx="6" fill="#3a86ff"/>
                                <rect x="20" y="24" width="24" height="16" rx="3" fill="#fff"/>
                                <circle cx="32" cy="32" r="4" fill="#3a86ff"/>
                            </svg>
                        </div>
                        <h1>Bienvenido a Cinema3D</h1>
                        <h2>Selecciona una sucursal:</h2>
                        <form id="branch-form">
                                <select name="branch" id="branch-select" required>
                                        <option value="" disabled selected>Elige una sucursal</option>
                                        {% for b in branches %}
                                                <option value="{{ b }}" {% if branch == b %}selected{% endif %}>{{ b }}</option>
                                        {% endfor %}
                                </select>
                                <button type="submit">Seleccionar</button>
                        </form>
                        <div id="msg"></div>
                        {% if branch %}
                                <div class="selected-branch">
                                        Sucursal seleccionada: <strong>{{ branch }}</strong>
                                </div>
                                <form id="clear-form">
                                        <button type="submit" class="clear-btn">Quitar selección</button>
                                </form>
                        {% endif %}
                                <div class="card-footer-btns">
                                    <a href="/" class="footer-btn footer-btn-left">Volver</a>
                                    <a href="/cartelera" class="footer-btn footer-btn-right">Ver cartelera</a>
                                </div>
                                    </div>
            <style>
            .card-footer-btns {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 2.2rem;
                position: relative;
            }
            .footer-btn {
                display: inline-block;
                min-width: 120px;
                text-align: center;
                padding: 0.6rem 1.7rem;
                border-radius: 10px;
                font-size: 1.13rem;
                font-family: 'Montserrat', Arial, sans-serif;
                font-weight: 700;
                text-decoration: none;
                transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
                box-shadow: 0 2px 12px #23294633;
                border: none;
                cursor: pointer;
            }
            .footer-btn-left {
                background: #393e6e;
                color: #eaeaea;
                border: 1px solid #b8c1ec;
            }
            .footer-btn-left:hover {
                background: #d32f2f;
                color: #fff;
                border: 1px solid #d32f2f;
                transform: translateY(-2px) scale(1.06);
            }
            .footer-btn-right {
                background: linear-gradient(90deg, #3a86ff 60%, #5e60ce 100%);
                color: #fff;
            }
            .footer-btn-right:hover {
                background: linear-gradient(90deg, #232946 60%, #3a86ff 100%);
                color: #fff;
                transform: translateY(-2px) scale(1.06);
            }
            </style>
                    </div>
                </div>
            <script>
            // Efecto de partículas animadas sutiles
            const canvas = document.querySelector('.particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            function createParticles() {
                particles = [];
                for (let i = 0; i < 32; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: 2 + Math.random() * 3,
                        dx: -0.2 + Math.random() * 0.4,
                        dy: -0.2 + Math.random() * 0.4,
                        o: 0.10 + Math.random() * 0.18
                    });
                }
            }
            createParticles();
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (const p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${p.o})`;
                    ctx.shadowColor = '#2d8cff';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                }
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', createParticles);
            </script>
    <script>
    document.getElementById('branch-form').onsubmit = async function(e) {
        e.preventDefault();
        const select = document.getElementById('branch-select');
        const branch = select.value;
        const res = await fetch('/set-branch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({branch})
        });
        const data = await res.json();
        if (data.ok) {
            location.reload();
        } else {
            document.getElementById('msg').textContent = data.error || 'Error';
        }
    };
    const clearForm = document.getElementById('clear-form');
    if (clearForm) {
        clearForm.onsubmit = async function(e) {
            e.preventDefault();
            await fetch('/clear-branch', {method: 'POST'});
            location.reload();
        };
    }
    </script>
</body>
</html>
